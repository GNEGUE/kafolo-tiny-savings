<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KAFOLO - Tiny Savings</title>
<style>
*{box-sizing:border-box;font-family:sans-serif}body{margin:0;background:#fef9f0;color:#222;padding:16px}
h1{margin:0;font-size:28px}.card{background:white;border-radius:20px;padding:18px;box-shadow:0 4px 15px rgba(0,0,0,.07);margin:12px 0}
.balance{font-size:36px;font-weight:900;color:#ff6b35}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{border:none;border-radius:16px;padding:16px;font-weight:700;font-size:15px;cursor:pointer}
.btn-orange{background:#ff6b35;color:white}.btn-light{background:#fff3e8;color:#ff6b35}
.btn-dark{background:#222;color:white;width:100%;margin-top:10px;padding:18px;font-size:18px}
.tirelire{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #eee}
.tag{padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700}
.mix{background:#e3f2ff;color:#1976d2}.baya{background:#fce4ec;color:#c2185b}.dep{background:#e8f5e9;color:#2e7d32}
input{width:100%;padding:14px;border-radius:12px;border:2px solid #ffe0cc;font-size:16px;margin:8px 0}
</style>
</head>
<body>
<h1>🐖 KAFOLO</h1><p style="color:#888;margin-top:2px">Tiny Savings • Lomé</p>

<div class="card">
<div style="color:#888;font-size:13px">TOTAL ÉPARGNÉ</div>
<div class="balance" id="total">0 F</div>
<div style="color:#888;font-size:13px" id="count">0 dépôts</div>
</div>

<div class="grid">
<button class="btn btn-orange" onclick="depot()">+ Dépôt</button>
<button class="btn btn-light" onclick="retrait()">- Retrait</button>
</div>

<div class="card">
<h3 style="margin:0 0 10px 0">🐷 Ma Tirelire</h3>
<div id="liste"></div>
<div class="grid" style="margin-top:14px">
<button class="btn btn-light" onclick="addTirelire('Mix')">+ Mix</button>
<button class="btn btn-light" onclick="addTirelire('Baya')">+ Baya</button>
</div>
</div>

<div class="card">
<h3 style="margin:0 0 10px 0">📜 Historique</h3>
<div id="hist" style="font-size:14px;color:#666">Pas encore de dépôt</div>
</div>

<script>
let data = JSON.parse(localStorage.getItem('kafolo')||'{"total":0,"items":[],"hist":[]}');
function save(){localStorage.setItem('kafolo',JSON.stringify(data));render()}
function render(){
 document.getElementById('total').textContent=data.total.toLocaleString()+' F';
 document.getElementById('count').textContent=data.hist.length+' dépôts';
 let h='';
 data.items.forEach((it,i)=>{
  h+=`<div class="tirelire"><div><b>${it.nom}</b><br><small style="color:#888">${it.montant} F</small></div><span class="tag ${it.nom.toLowerCase()}">${it.nom}</span></div>`;
 });
 if(!data.items.length) h='<div style="color:#aaa">Clique + Mix ou + Baya pour créer</div>';
 document.getElementById('liste').innerHTML=h;
 let hh='';
 data.hist.slice().reverse().forEach(x=>{hh+=`<div style="padding:6px 0;border-bottom:1px solid #f5f5f5">• ${x}</div>`});
 if(hh) document.getElementById('hist').innerHTML=hh;
}
function depot(){
 let m=prompt('Montant du dépôt en F ? (ex: 500)');
 if(!m) return;
 m=parseInt(m); if(isNaN(m)) return;
 let nom=prompt('Pour quelle tirelire ? Tape Mix ou Baya','Mix')||'Mix';
 data.total+=m;
 let found=data.items.find(i=>i.nom.toLowerCase()==nom.toLowerCase());
 if(found) found.montant+=m; else data.items.push({nom:nom,montant:m});
 data.hist.push('+'+m+' F dans '+nom+' - '+new Date().toLocaleDateString());
 save();
}
function retrait(){
 let m=prompt('Montant à retirer ?'); if(!m) return; m=parseInt(m);
 if(m>data.total){alert('Pas assez !');return;}
 data.total-=m; data.hist.push('-'+m+' F retrait'); save();
}
function addTirelire(nom){
 let m=prompt('Montant de départ pour '+nom+' ?','0')||'0';
 data.items.push({nom:nom,montant:parseInt(m)||0}); save();
}
render();
</script>
</body>
</html>
