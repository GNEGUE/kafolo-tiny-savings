<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KAFOLO</title><style>body{font-family:system-ui;background:#FFF7ED;margin:0;padding:20px} .card{background:white;border-radius:24px;padding:20px;max-width:400px;margin:auto;box-shadow:0 10px 30px #0001} .btn{width:100%;background:#f97316;color:white;border:none;padding:16px;border-radius:16px;font-size:18px;font-weight:bold;margin-top:15px} .tirelire{display:flex;gap:10px;margin:20px 0} .box{flex:1;border-radius:16px;padding:15px;text-align:center} .bloque{background:#FFF7ED;border:2px solid #fed7aa} .libre{background:#f0fdf4;border:2px solid #bbf7d0} input{width:100%;padding:14px;border-radius:12px;border:2px solid #e5e7eb;margin-top:10px;box-sizing:border-box}</style></head><body><div class="card"><h1>🐖 KAFOLO Tiny</h1><div class="tirelire"><div class="box bloque"><b id="b">0 F</b><br><small>🔒 90% Bloqué</small></div><div class="box libre"><b id="l">0 F</b><br><small>💸 10% Libre</small></div></div><input id="montant" type="number" placeholder="Montant ex: 500" oninput="calc()"><button class="btn" onclick="save()">🔒 Épargner</button><div id="hist" style="margin-top:20px"></div></div><script>let totalB=parseInt(localStorage.getItem('b')||0),totalL=parseInt(localStorage.getItem('l')||0),hist=JSON.parse(localStorage.getItem('h')||'[]');update();function calc(){let m=parseInt(montant.value)||0;b.innerText=Math.round(m*0.9)+' F';l.innerText=Math.round(m*0.1)+' F'}function save(){let m=parseInt(montant.value)||0;if(!m)return alert('Mets montant');let addB=Math.round(m*0.9),addL=Math.round(m*0.1);totalB+=addB;totalL+=addL;hist.unshift({m,date:new Date().toLocaleDateString()});localStorage.setItem('b',totalB);localStorage.setItem('l',totalL);localStorage.setItem('h',JSON.stringify(hist));montant.value='';update();alert('Bravo '+addB+'F bloqués')}function update(){document.getElementById('b').innerText=totalB+' F';document.getElementById('l').innerText=totalL+' F';document.getElementById('hist').innerHTML=hist.map(h=>`<div style="border-bottom:1px solid #eee;padding:8px 0">💰 ${h.m}F - ${h.date}</div>`).join('')}</script></body></html>
